name: Validate workflow package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -X utf8 project-template/.tasks/tools/taskctl.py --root project-template validate
      - run: python -X utf8 project-template/.tasks/tools/taskctl.py --root examples/report-export validate
